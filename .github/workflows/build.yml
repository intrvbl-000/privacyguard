name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PrivacyGuard-v2/iPhonePrivacyGuard
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project PrivacyGuard.xcodeproj -scheme PrivacyGuard \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PrivacyGuard.app Payload/
          zip -r PrivacyGuard.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyGuard-ipa
          path: PrivacyGuard-v2/iPhonePrivacyGuard/PrivacyGuard.ipa
